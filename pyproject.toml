[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "gravmagpy"
version = "2026.9.22"
description = "Python frontend for the GravMagSphere magnetic and gravity solver and inversion toolkit"
readme = "README.md"
requires-python = ">=3.13,<4"
license = {file = "LICENSE"}
authors = [{name = "Dany Waller", email = "dany.c.waller@gmail.com"}]
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
validation = ["mpmath>=1.3"]
maps = ["matplotlib>=3.8", "rasterio>=1.4"]
geospatial = ["rasterio", "pyshtools", "spiceypy"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gravmagpy*"]
